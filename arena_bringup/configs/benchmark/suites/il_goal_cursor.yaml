# IL collection, automatic operator (dynamic_gap il_goal_cursor, cursor held toward the goal).
# Random start and goal every episode, no pedestrians, random static obstacles so
# that there are gaps to choose between (an empty map gives a single gap).
# Run: start_trials.launch man_gap:=true il_goal_cursor:=true tm_modules:=benchmark
#      benchmark_suite:=il_goal_cursor.yaml record_il:=true il_data_root:=... il_operator:=goal_cursor
stages:
  - name: map_empty_goal_cursor
    episodes: 30
    robot: rto
    map: map_empty
    tm_robots: random
    tm_obstacles: random
    timeout: 120
    config:
      RANDOM:
        static: {min: 15, max: 30, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}

  - name: map_empty_medium_goal_cursor
    episodes: 30
    robot: rto
    map: map_empty_medium
    tm_robots: random
    tm_obstacles: random
    timeout: 90
    config:
      RANDOM:
        static: {min: 5, max: 12, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}

  - name: map1_small_goal_cursor
    episodes: 30
    robot: rto
    map: map1_small
    tm_robots: random
    tm_obstacles: random
    timeout: 90
    config:
      RANDOM:
        static: {min: 0, max: 4, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}

  - name: experiment_rooms_goal_cursor
    episodes: 30
    robot: rto
    map: experiment_rooms
    tm_robots: random
    tm_obstacles: random
    timeout: 120
    config:
      RANDOM:
        static: {min: 3, max: 8, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}

  - name: small_warehouse_goal_cursor
    episodes: 30
    robot: rto
    map: small_warehouse
    tm_robots: random
    tm_obstacles: random
    timeout: 120
    config:
      RANDOM:
        static: {min: 0, max: 5, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}
