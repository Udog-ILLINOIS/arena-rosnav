        file: 0_50ped_middle_start_v5.json

  - name: il_eval_v7_50ped_bottom_right
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
      SCENARIO:
        file: 0_50ped_middle_start_v7.json

  - name: il_eval_v9_50ped_bottom_right
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
      SCENARIO:
        file: 0_50ped_middle_start_v9.json

  - name: il_eval_v10_50ped_bottom_right
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
      SCENARIO:
        file: 0_50ped_middle_start_v10.json

  - name: il_eval_v11_50ped_bottom_left
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
      SCENARIO:
        file: 0_50ped_middle_start_v11.json

  - name: il_eval_sg11_50ped
    episodes: 1
    robot: rto
    map: gru_learn
    tm_robots: scenario
    tm_obstacles: scenario
    timeout: 120
    config:
