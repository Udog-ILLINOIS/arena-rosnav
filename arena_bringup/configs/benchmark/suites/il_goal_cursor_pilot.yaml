# IL collection, automatic operator (dynamic_gap il_goal_cursor): pilot, map_empty only.
# Random start and goal every episode, no pedestrians, random static obstacles
# (an empty map gives a single gap, so no choice to learn).
stages:
  - name: map_empty_goal_cursor_pilot2
    episodes: 3
    robot: rto
    map: map_empty
    tm_robots: random
    tm_obstacles: random
    timeout: 120
    config:
      RANDOM:
        static: {min: 10, max: 20, models: ["shelf", "long_shelf", "table", "pallet", "office_desk", "tree"]}
        interactive: {min: 0, max: 0, models: ["shelf"]}
        dynamic: {min: 0, max: 0, models: ["actor1"]}
